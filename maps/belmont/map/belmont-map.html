    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true
    });

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      }
    ).addTo(map);

    const baseStyle = {
      color: "#8fe3ed",
      weight: 1.6,
      opacity: 1,
      fillColor: "#25adc2",
      fillOpacity: 0.34
    };

    const hoverStyle = {
      color: "#ffffff",
      weight: 2.6,
      opacity: 1,
      fillColor: "#25adc2",
      fillOpacity: 0.52
    };

    let geoLayer;

    function addLabel(feature, layer) {
      const props = feature.properties || {};
      const name = props.name || "Neighborhood";

      let latlng;
      if (
        Number.isFinite(props.center_latitude) &&
        Number.isFinite(props.center_longitude)
      ) {
        latlng = [props.center_latitude, props.center_longitude];
      } else {
        latlng = layer.getBounds().getCenter();
      }

      L.tooltip({
        permanent: true,
        direction: "center",
        className: "neighborhood-label",
        opacity: 1
      })
      .setLatLng(latlng)
      .setContent(name)
      .addTo(map);
    }

    function onEachFeature(feature, layer) {
      const props = feature.properties || {};
      const name = props.name || "Neighborhood";
      const slug = props.slug || "";

      const url = name ? "/belmont/" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") : "#";

      layer.bindPopup(
        "<strong>" + name + "</strong><br>" +
        '<a href="' + url + '">View neighborhood</a>'
      );

      layer.on({
        mouseover: function (event) {
          event.target.setStyle(hoverStyle);
          event.target.bringToFront();
        },
        mouseout: function (event) {
          geoLayer.resetStyle(event.target);
        }
      });

      addLabel(feature, layer);
    }

    geoLayer = L.geoJSON(neighborhoods, {
      style: baseStyle,
      onEachFeature: onEachFeature
    }).addTo(map);

    const bounds = geoLayer.getBounds();

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        padding: [24, 24]
      });
    } else {
      map.setView([37.518, -122.296], 13);
    }

    const title = L.control({ position: "topright" });

    title.onAdd = function () {
      const div = L.DomUtil.create("div", "map-title");
      div.textContent = "Belmont Neighborhoods";
      return div;
    };

    title.addTo(map);

    setTimeout(function () {
      map.invalidateSize();
    }, 100);
