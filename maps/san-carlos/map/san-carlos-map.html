  const map = L.map("map", {
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2ol7_1_49978b63b592d647f2dac9c7",
    {
      subdomains: "abcd",
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }
  ).addTo(map);

  const baseStyle = {
    color: "#8fe3ed",
    weight: 1.6,
    opacity: 1,
    fillColor: "#25adc2",
    fillOpacity: 0.34
  };

  const hoverStyle = {
    color: "#ffffff",
    weight: 2.6,
    fillColor: "#25adc2",
    fillOpacity: 0.52
  };

  function neighborhoodUrl(name, slug) {
    return name ? "/san-carlos/" + (slug || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")) : "#";
  }

  function onEachFeature(feature, layer) {
    const props = feature.properties || {};
    const name = props.name || "Neighborhood";
    const slug = props.slug || "";

    layer.bindPopup(
      '<strong>' + name + '</strong><br>' +
      '<a href="' + neighborhoodUrl(name, slug) + '">View neighborhood</a>'
    );

    layer.on({
      mouseover: function(e) {
        e.target.setStyle(hoverStyle);
        e.target.bringToFront();
      },
      mouseout: function(e) {
        geoLayer.resetStyle(e.target);
      }
    });

    let labelLatLng = null;
    if (Number.isFinite(props.center_latitude) && Number.isFinite(props.center_longitude)) {
      labelLatLng = [props.center_latitude, props.center_longitude];
    } else {
      labelLatLng = layer.getBounds().getCenter();
    }

    L.tooltip({
      permanent: true,
      direction: "center",
      className: "neighborhood-label",
      opacity: 1
    })
    .setContent(name)
    .setLatLng(labelLatLng)
    .addTo(map);
  }

  const geoLayer = L.geoJSON(neighborhoods, {
    style: baseStyle,
    onEachFeature: onEachFeature
  }).addTo(map);

  const bounds = geoLayer.getBounds();
  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [24, 24] });
  } else {
    map.setView([37.4981, -122.2708], 13);
  }

  const title = L.control({position: "topright"});
  title.onAdd = function() {
    const div = L.DomUtil.create("div", "map-title");
    div.textContent = "San Carlos Neighborhoods";
    return div;
  };
  title.addTo(map);
</script>
