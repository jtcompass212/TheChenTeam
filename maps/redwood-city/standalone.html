const baseUrl = "/redwood-city/";

const map = L.map("map", {
  zoomControl:true,
  scrollWheelZoom:true
});

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  maxZoom:20,
  subdomains:"abcd",
  attribution:"&copy; OpenStreetMap contributors &copy; CARTO"
}).addTo(map);

function style(feature) {
  const hidden = Boolean(feature?.properties?.hidden);
  return {
    color:hidden ? "#6b8990" : "#8fe3ed",
    weight:hidden ? 1 : 1.6,
    opacity:1,
    fillColor:hidden ? "#36555b" : "#25adc2",
    fillOpacity:hidden ? 0.10 : 0.34
  };
}

const hoverStyle = {
  color:"#fff",
  weight:3,
  fillColor:"#25adc2",
  fillOpacity:0.58
};

let geoLayer;

function onEachFeature(feature, layer) {
  const p = feature.properties || {};
  const name = p.name || "Neighborhood";
  const city = p.city || "Redwood City";
  const slug = p.slug || "";
  const href = name ? baseUrl + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") : "#";

  layer.bindPopup(`
    <div class="popup">
      <h3>${name}</h3>
      <p>${city}</p>
      <a href="${href}">View neighborhood</a>
    </div>
  `);

  layer.on({
    mouseover(e) {
      e.target.setStyle(hoverStyle);
      e.target.bringToFront();
    },
    mouseout(e) {
      geoLayer.resetStyle(e.target);
    },
    click(e) {
      e.target.openPopup();
    }
  });
}

geoLayer = L.geoJSON(data, {
  style,
  onEachFeature
}).addTo(map);

const labels = L.layerGroup().addTo(map);
data.features.forEach(feature => {
  const p = feature.properties || {};
  const lat = Number(p.center_latitude);
  const lng = Number(p.center_longitude);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  L.tooltip({
    permanent:true,
    direction:"center",
    className:"neighborhood-label",
    opacity:1
  })
  .setLatLng([lat,lng])
  .setContent(p.name || "Neighborhood")
  .addTo(labels);
});

const bounds = geoLayer.getBounds();
if (bounds.isValid()) {
  map.fitBounds(bounds, {padding:[24,24]});
} else {
  map.setView([37.49,-122.24],12);
}

const title = L.control({position:"topright"});
title.onAdd = () => {
  const div = L.DomUtil.create("div","map-title");
  div.textContent = "Redwood City Neighborhoods";
  return div;
};
title.addTo(map);
</script>
