<script>
(function() {
  var BASE_PATH = "/san-francisco/";

  // The primary neighborhood is listed LAST on purpose: Leaflet draws each feature's SVG path in array
  // order, so whatever comes last is drawn on top. This guarantees the primary border wins along every
  // shared edge — no separate "bring to front" call needed.
  var neighborhoodData = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Civic Center","slug":"civic-center","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.41858,37.78026],[-122.41958,37.78495],[-122.42118,37.78475],[-122.4224,37.79036],[-122.42398,37.79015],[-122.42338,37.78734],[-122.42502,37.78713],[-122.42354,37.77968],[-122.42189,37.77989],[-122.4207,37.77409],[-122.41157,37.78128],[-122.41858,37.78026]]]]}},{"type":"Feature","properties":{"name":"Lower Nob Hill","slug":"lower-nob-hill","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.42118,37.78475],[-122.4097,37.7862],[-122.41074,37.79136],[-122.4223,37.78988],[-122.42118,37.78475]]]]}},{"type":"Feature","properties":{"name":"South of Market","slug":"south-of-market","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.39498,37.77709],[-122.39887,37.78019],[-122.40111,37.77845],[-122.4081,37.78402],[-122.40898,37.78331],[-122.41158,37.78127],[-122.4207,37.77408],[-122.42327,37.77197],[-122.42296,37.77124],[-122.42244,37.77071],[-122.42226,37.77056],[-122.42123,37.7702],[-122.4179,37.76977],[-122.41084,37.76942],[-122.40897,37.7691],[-122.40664,37.76896],[-122.40606,37.76922],[-122.40584,37.76967],[-122.40439,37.76975],[-122.40166,37.77181],[-122.39498,37.77709]]]]}},{"type":"Feature","properties":{"name":"Union Square","slug":"union-square","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.40898,37.78331],[-122.4081,37.78402],[-122.40745,37.7846],[-122.40629,37.78551],[-122.40606,37.78576],[-122.4034,37.78781],[-122.40366,37.78888],[-122.40384,37.78983],[-122.40389,37.78982],[-122.40389,37.78985],[-122.40525,37.78965],[-122.40692,37.78944],[-122.40741,37.7918],[-122.41073,37.79138],[-122.40913,37.78342],[-122.40898,37.78331]]]]}},{"type":"Feature","properties":{"name":"Tenderloin","slug":"tenderloin","primary":true},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.40898,37.7   L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2ol7_1_49978b63b592d647f2dac9c7', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var primaryLayer = null;

  var geoLayer = L.geoJSON(neighborhoodData, {
    style: function(feature) {
      var primary = feature.properties.primary;
      return {
        color: primary ? '#8c6930' : '#9aa3b8',
        weight: primary ? 2.5 : 1.5,
        opacity: 1,
        fillColor: primary ? '#a8823d' : '#c7cedb',
        fillOpacity: primary ? 0.45 : 0.28
      };
    },
    onEachFeature: function(feature, layer) {
      layer.bindTooltip(feature.properties.name, { permanent: true, direction: 'center', className: 'pk-label' });
      if (feature.properties.primary) {
        primaryLayer = layer;
      } else {
        layer.on('mouseover', function() { layer.setStyle({ fillOpacity: 0.45 }); });
        layer.on('mouseout', function() { layer.setStyle({ fillOpacity: 0.28 }); });
        layer.on('click', function() { window.location.href = BASE_PATH + feature.properties.slug + "/"; });
        if (layer.getElement()) layer.getElement().style.cursor = 'pointer';

    }

  map.fitBounds((primaryLayer || geoLayer).getBounds(), { padding: [28, 28] });
