<style>
  .san-mateo-park-map-wrap { position: relative; width: 100%; height: 420px; border-radius: 8px; overflow: hidden; border: 1px solid #dde1e9; font-family: 'Inter', system-ui, sans-serif; }
  .san-mateo-park-map-wrap #san-mateo-park-map { width: 100%; height: 100%; }
  .san-mateo-park-map-wrap .pk-label { background: transparent; border: none; box-shadow: none; font-weight: 600; font-size: 12px; color: #16233f; text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 -1px 2px rgba(255,255,255,0.9); }
  .san-mateo-park-map-wrap .pk-legend { position: absolute; bottom: 14px; left: 14px; background: #ffffff; border: 1px solid #dde1e9; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #4b5468; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
  .san-mateo-park-map-wrap .pk-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .san-mateo-park-map-wrap .pk-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
<div class="san-mateo-park-map-wrap">
  <div id="san-mateo-park-map"></div>
  <div class="pk-legend">
    <span><span class="pk-swatch" style="background:#a8823d;"></span> San Mateo Park</span>
    <span><span class="pk-swatch" style="background:#c7cedb;"></span> Neighboring areas (click to explore)</span>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function() {
  var BASE_PATH = "/san-mateo/";

  // The primary neighborhood is listed LAST on purpose: Leaflet draws each feature's SVG path in array
  // order, so whatever comes last is drawn on top. This guarantees the primary border wins along every
  // shared edge — no separate "bring to front" call needed.
  var neighborhoodData = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Eastern Addition","slug":"eastern-addition","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.31920882,37.56640171],[-122.32517829,37.56228227],[-122.32996101,37.5669936],[-122.33763477,37.57116956],[-122.34276772,37.57471275],[-122.33448438,37.58046102],[-122.31920882,37.56640171]]]]}},{"type":"Feature","properties":{"name":"San Mateo Park","slug":"san-mateo-park","primary":true},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.3342617,37.5693343],[-122.3363399,37.567514],[-122.337528,37.566926],[-122.3380427,37.567567],[-122.35253404,37.5609148],[-122.35488967,37.56420426],[-122.35008145,37.56630928],[-122.3524494,37.56972368],[-122.3427654,37.5747145],[-122.33763477,37.57116956],[-122.3342617,37.5693343]]]]}}]};

  var map = L.map('san-mateo-park-map', { scrollWheelZoom: false, zoomControl: true });

  // CARTO Voyager — same colorful, labeled basemap as the citywide neighborhoods map.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var geoLayer = L.geoJSON(neighborhoodData, {
    style: function(feature) {
      var primary = feature.properties.primary;
      return {
        color: primary ? '#8c6930' : '#9aa3b8',
        weight: primary ? 2.5 : 1.5,
        opacity: 1,
        fillColor: primary ? '#a8823d' : '#c7cedb',
        fillOpacity: primary ? 0.45 : 0.28
      };
    },
    onEachFeature: function(feature, layer) {
      layer.bindTooltip(feature.properties.name, { permanent: true, direction: 'center', className: 'pk-label' });
      if (!feature.properties.primary) {
        layer.on('mouseover', function() { layer.setStyle({ fillOpacity: 0.45 }); });
        layer.on('mouseout', function() { layer.setStyle({ fillOpacity: 0.28 }); });
        layer.on('click', function() { window.location.href = BASE_PATH + feature.properties.slug + "/"; });
        if (layer.getElement()) layer.getElement().style.cursor = 'pointer';
      }
    }
  }).addTo(map);

  map.fitBounds(geoLayer.getBounds(), { padding: [24, 24] });
})();
</script>
