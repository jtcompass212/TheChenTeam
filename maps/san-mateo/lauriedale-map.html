<style>
  .lauriedale-map-wrap { position: relative; width: 100%; height: 420px; border-radius: 8px; overflow: hidden; border: 1px solid #dde1e9; font-family: 'Inter', system-ui, sans-serif; }
  .lauriedale-map-wrap #lauriedale-map { width: 100%; height: 100%; }
  .lauriedale-map-wrap .pk-label { background: transparent; border: none; box-shadow: none; font-weight: 600; font-size: 12px; color: #16233f; text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 -1px 2px rgba(255,255,255,0.9); }
  .lauriedale-map-wrap .pk-legend { position: absolute; bottom: 14px; left: 14px; background: #ffffff; border: 1px solid #dde1e9; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #4b5468; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
  .lauriedale-map-wrap .pk-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lauriedale-map-wrap .pk-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
<div class="lauriedale-map-wrap">
  <div id="lauriedale-map"></div>
  <div class="pk-legend">
    <span><span class="pk-swatch" style="background:#a8823d;"></span> Lauriedale</span>
    <span><span class="pk-swatch" style="background:#c7cedb;"></span> Neighboring areas (click to explore)</span>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function() {
  var BASE_PATH = "/san-mateo/";

  // The primary neighborhood is listed LAST on purpose: Leaflet draws each feature's SVG path in array
  // order, so whatever comes last is drawn on top. This guarantees the primary border wins along every
  // shared edge — no separate "bring to front" call needed.
  var neighborhoodData = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"San Mateo Village","slug":"san-mateo-village","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.278188,37.534023],[-122.288761,37.533824],[-122.2903007,37.5316356],[-122.2974351,37.5371243],[-122.291549,37.5410363],[-122.2895936,37.5435679],[-122.2879774,37.5445326],[-122.278188,37.534023]]]]}},{"type":"Feature","properties":{"name":"Westwood Knolls","slug":"westwood-knolls","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.30827817,37.53191565],[-122.30525435,37.53359746],[-122.30147577,37.53415901],[-122.2974439,37.5371232],[-122.2903223,37.5316518],[-122.286987,37.529428],[-122.30191314,37.52337834],[-122.30470898,37.52627633],[-122.30827817,37.53191565]]]]}},{"type":"Feature","properties":{"name":"Lauriedale","slug":"lauriedale","primary":true},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.2902957,37.5316444],[-122.2887118,37.5338359],[-122.2781904,37.5340198],[-122.273565,37.5292295],[-122.2735865,37.5275757],[-122.2855455,37.5306919],[-122.286988,37.5294368],[-122.2902957,37.5316444]]]]}}]};

  var map = L.map('lauriedale-map', { scrollWheelZoom: false, zoomControl: true });

  // CARTO Voyager — same colorful, labeled basemap as the citywide neighborhoods map.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var geoLayer = L.geoJSON(neighborhoodData, {
    style: function(feature) {
      var primary = feature.properties.primary;
      return {
        color: primary ? '#8c6930' : '#9aa3b8',
        weight: primary ? 2.5 : 1.5,
        opacity: 1,
        fillColor: primary ? '#a8823d' : '#c7cedb',
        fillOpacity: primary ? 0.45 : 0.28
      };
    },
    onEachFeature: function(feature, layer) {
      layer.bindTooltip(feature.properties.name, { permanent: true, direction: 'center', className: 'pk-label' });
      if (!feature.properties.primary) {
        layer.on('mouseover', function() { layer.setStyle({ fillOpacity: 0.45 }); });
        layer.on('mouseout', function() { layer.setStyle({ fillOpacity: 0.28 }); });
        layer.on('click', function() { window.location.href = BASE_PATH + feature.properties.slug + "/"; });
        if (layer.getElement()) layer.getElement().style.cursor = 'pointer';
      }
    }
  }).addTo(map);

  map.fitBounds(geoLayer.getBounds(), { padding: [24, 24] });
})();
</script>
