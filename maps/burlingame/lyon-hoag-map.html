<script>

  var neighborhoodData = {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Burlingables","slug":"burlingables","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.335871,37.586789],[-122.344201,37.586965],[-122.345029,37.586491],[-122.350428,37.582817],[-122.344573,37.580284],[-122.33604,37.586279],[-122.335871,37.586789]]]]}},{"type":"Feature","properties":{"name":"Downtown Burlingame","slug":"downtown-burlingame","primary":false},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.344589,37.580294],[-122.348491,37.582005],[-122.350454,37.582808],[-122.351465,37.582005],[-122.352863,37.581083],[-122.355808,37.57906],[-122.356254,37.578792],[-122.356018,37.578496],[-122.354357,37.577581],[-122.348892,37.576086],[-122.343025,37.574576],[-122.338696,37.577538],[-122.340758,37.578435],[-122.342869,37.579298],[-122.342602,37.579417],[-122.344589,37.580294]]]]}},{"type":"Feature","properties":{"name":"Ingoldmilldale","slug":"ingoldmilldale","primary":false},"geometry":{"type":"Polygon","coordinates":[[[-122.373355,37.604226],[-122.38472,37.597324],[-122.38216,37.595525],[-122.363476,37.58764],[-122.362376,37.588972],[-122.359707,37.589121],[-122.357344,37.588035],[-122.352537,37.58715],[-122.334907,37.58676],[-122.334561,37.587209],[-122.334489,37.592039],[-122.359959,37.591992],[-122.361818,37.593496],[-122.363977,37.598408],[-122.369178,37.602058],[-122.373355,37.604226]]]}},{"type":"Feature","properties":{"name":"Lyon Hoag","slug":"lyon-hoag","primary":true},"geometry":{"type":"MultiPolygon","coordinates":[[[[-122.334915,37.586761],[-122.335883,37.586784],[-122.336039,37.586276],[-122.344589,37.580294],[-122.342602,37.579417],[-122.342869,37.579298],[-122.340758,37.578435],[-122.338696,37.577538],[-122.33084,37.58299],[-122.334915,37.586761]]]]}}]};

  var geoLayer = L.geoJSON(neighborhoodData, {

        if (layer.getElement()) layer.getElement().style.cursor = 'pointer';
      }
    }
  }).addTo(map);

  map.fitBounds(geoLayer.getBounds(), { padding: [24, 24] });
