  weight:1.5,
  opacity:0.95,
  fillColor:"#25adc2",

});

const hoverStyle = {
  weight:3,
  color:"#ffffff",
  fillColor:"#25adc2",
  fillOpacity:0.72
};

let neighborhoodLayer;

function slugify(name) {
  return (name || "neighborhood")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

function onEachNeighborhood(feature, layer) {
  const p = feature.properties || {};
  const name = p.name || "Neighborhood";
  const slug = p.slug || slugify(name);
  const url = name ? neighborhoodBaseUrl + (slug || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")) : "#";

  layer.bindTooltip(name, {
    permanent:true,
    direction:"center",
    className:"neighborhood-label"
  });

  layer.bindPopup(`
    <div class="map-popup">
      <h3>${name}</h3>
      <a href="${url}">View neighborhood</a>
    </div>
  `);

  layer.on({
    mouseover:e=>{
      e.target.setStyle(hoverStyle);
      e.target.bringToFront();
    },
    mouseout:e=>neighborhoodLayer.resetStyle(e.target),
    click:e=>e.target.openPopup()
  });
}

  onEachFeature:onEachNeighborhood
}).addTo(map);
