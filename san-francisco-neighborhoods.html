    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (typeof L === "undefined") {
      document.getElementById("load-error").style.display = "flex";
    } else {
      const map = L.map("map", {
        zoomControl: true,
        preferCanvas: true
      });

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          maxZoom: 20,
          subdomains: "abcd",
          attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
        }
      ).addTo(map);

      const defaultStyle = {
        color: "#28c7b7",
        weight: 2,
        opacity: 0.95,
        fillColor: "#18a89a",
        fillOpacity: 0.30
      };

      const hoverStyle = {
        color: "#ffffff",
        weight: 3,
        fillColor: "#34d6c5",
        fillOpacity: 0.52
      };

      const labelLayer = L.layerGroup().addTo(map);

      const geoLayer = L.geoJSON(geojsonData, {
        style: defaultStyle,
        onEachFeature: function(feature, layer) {
          const props = feature.properties || {};
          const name = props.name || "Neighborhood";
          const slug = props.slug || props.seo_id || "";
          const url = slug ? "/neighborhoods/" + slug : "#";

          layer.bindPopup(
            "<strong>" + escapeHtml(name) + "</strong><br>" +
            '<a href="' + escapeHtml(url) + '">View neighborhood</a>'
          );

          layer.on("mouseover", function() {
            layer.setStyle(hoverStyle);
            if (layer.bringToFront) layer.bringToFront();
          });

          layer.on("mouseout", function() {
            geoLayer.resetStyle(layer);
          });

          layer.on("click", function() {
            if (layer.getBounds) {
              map.fitBounds(layer.getBounds(), {
                padding: [24, 24],
                maxZoom: 15
              });
            }
          });
        }
      }).addTo(map);

      geoLayer.eachLayer(function(layer) {
        const props = (layer.feature && layer.feature.properties) || {};
        const name = props.name;

        if (!name || !layer.getBounds) return;

        let center;
        if (Number.isFinite(props.center_latitude) && Number.isFinite(props.center_longitude)) {
          center = L.latLng(props.center_latitude, props.center_longitude);
        } else if (Number.isFinite(props.center_lat) && Number.isFinite(props.center_lon)) {
          center = L.latLng(props.center_lat, props.center_lon);
        } else {
          center = layer.getBounds().getCenter();
        }

        L.marker(center, {
          interactive: false,
          icon: L.divIcon({
            className: "neighborhood-label",
            html: escapeHtml(name),
            iconSize: [140, 36],
            iconAnchor: [70, 18]
          })
        }).addTo(labelLayer);
      });

      if (geoLayer.getLayers().length > 0) {
        map.fitBounds(geoLayer.getBounds(), { padding: [24, 24] });
      } else {
        map.setView([37.7749, -122.4194], 12);
      }

      const title = L.control({ position: "topright" });
      title.onAdd = function() {
        const div = L.DomUtil.create("div", "map-title");
        div.textContent = "San Francisco Neighborhoods";
        return div;
      };
      title.addTo(map);
    }
