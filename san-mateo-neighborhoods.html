    }

    .neighborhood-label {
      background: transparent;
      border: 0;

      white-space: normal;
      width: 140px;

    .map-popup {

      font-family: Arial, Helvetica, sans-serif;
    }

    .map-popup h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .map-popup a {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 4px;
      background: #25adc2;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .map-popup a:hover {
      text-decoration: underline;
    }
  </style>

    const neighborhoodBaseUrl = "/neighborhoods/";

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true
    }).setView([37.55, -122.32], 13);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 20,
        subdomains: "abcd",
        attribution:
          "&copy; OpenStreetMap contributors &copy; CARTO"
      }
    ).addTo(map);

    const defaultStyle = () => ({
      color: "#86d9e5",
      weight: 1.5,
      opacity: 0.95,
      fillColor: "#25adc2",
      fillOpacity: 0.42
    });

    const hoverStyle = {
      weight: 3,
      color: "#ffffff",
      fillColor: "#25adc2",
      fillOpacity: 0.72
    };

    let neighborhoodLayer;

    function onEachNeighborhood(feature, layer) {
      const props = feature.properties || {};
      const name = props.name || "Neighborhood";
      const slug = props.slug || "";
      const url = neighborhoodBaseUrl + encodeURIComponent(slug);

      layer.bindTooltip(name, {
        permanent: true,
        direction: "center",
        className: "neighborhood-label"
      });

      layer.bindPopup(`
        <div class="map-popup">
          <h3>${name}</h3>
          <a href="${url}">View neighborhood</a>
        </div>
      `);

      layer.on({
        mouseover: event => {
          event.target.setStyle(hoverStyle);
          event.target.bringToFront();
        },

        mouseout: event => {
          neighborhoodLayer.resetStyle(event.target);
        },

        click: event => {
          event.target.openPopup();
        }
      });
    }

    neighborhoodLayer = L.geoJSON(neighborhoods, {
      style: defaultStyle,
      onEachFeature: onEachNeighborhood
    }).addTo(map);

    map.fitBounds(neighborhoodLayer.getBounds(), {
      padding: [20, 20]
    });
