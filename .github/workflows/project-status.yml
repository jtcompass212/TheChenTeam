name: Project status

# The pre-push hook is opt-in per clone, so this is the backstop that covers
# everyone including pushes made from the GitHub web UI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README status block is current
        run: |
          if ! python3 scripts/update_readme_status.py --check; then
            echo "::error file=README.md::The 'Work remaining' section is stale. Run: python3 scripts/update_readme_status.py"
            python3 scripts/update_readme_status.py >/dev/null
            echo "--- what it should say ---"
            git --no-pager diff -- README.md
            exit 1
          fi

      - name: Pages verify
        run: python3 scripts/verify_repo.py

      - name: Sierra export is in sync with the pages
        run: |
          python3 scripts/build_sierra.py >/dev/null
          if ! git diff --quiet -- sierra-export; then
            echo "::error::sierra-export/ is stale. Run: python3 scripts/build_sierra.py"
            git --no-pager diff --stat -- sierra-export
            exit 1
          fi
